# Configuracion SOLO para pruebas: H2 en memoria en modo MariaDB.
# Sustituye a src/main/resources/application.properties al ejecutar mvn test,
# asi las pruebas corren en Jenkins sin tener MariaDB/dbgestor encendida.
spring.application.name=Ejercicio5MyAPIGestor
spring.datasource.url=jdbc:h2:mem:dbgestor;MODE=MariaDB;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
